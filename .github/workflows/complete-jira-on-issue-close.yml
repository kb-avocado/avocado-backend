name: Complete Jira Issue on GitHub Issue Close

on:
  issues:
    types:
      - closed

jobs:
  complete-jira-issue:
    if: contains(github.event.issue.labels.*.name, '🎟️ jira')

    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write

    steps:
      - name: Extract Jira Key
        id: extract
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          set -euo pipefail

          JIRA_KEY=$(printf '%s' "${ISSUE_TITLE}" \
            | grep -oE 'AVCD-[0-9]+' \
            | head -n 1 || true)

          if [[ -z "${JIRA_KEY}" ]]; then
            echo "GitHub Issue 제목에서 Jira 키를 찾지 못했습니다."
            echo "현재 제목: ${ISSUE_TITLE}"
            exit 1
          fi

          echo "jira_key=${JIRA_KEY}" >> "${GITHUB_OUTPUT}"
          echo "추출된 Jira 키: ${JIRA_KEY}"

      - name: Check Current Jira Status
        id: status
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_KEY: ${{ steps.extract.outputs.jira_key }}
        run: |
          set -euo pipefail

          BASE_URL="${JIRA_BASE_URL%/}"

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --output jira-issue.json \
            --write-out "%{http_code}" \
            --request GET \
            --url "${BASE_URL}/rest/api/3/issue/${JIRA_KEY}?fields=status" \
            --user "${JIRA_USER_EMAIL}:${JIRA_API_TOKEN}" \
            --header "Accept: application/json")

          echo "Jira 티켓 조회 응답: ${HTTP_STATUS}"
          cat jira-issue.json
          echo

          if [[ "${HTTP_STATUS}" -lt 200 || "${HTTP_STATUS}" -ge 300 ]]; then
            echo "Jira 티켓을 조회하지 못했습니다: ${JIRA_KEY}"
            exit 1
          fi

          STATUS_NAME=$(jq -r '.fields.status.name' jira-issue.json)
          STATUS_CATEGORY=$(jq -r '.fields.status.statusCategory.key' jira-issue.json)

          echo "현재 상태: ${STATUS_NAME}"
          echo "현재 상태 카테고리: ${STATUS_CATEGORY}"

          if [[ "${STATUS_CATEGORY}" == "done" ]]; then
            echo "already_done=true" >> "${GITHUB_OUTPUT}"
            echo "${JIRA_KEY}는 이미 완료 상태입니다."
          else
            echo "already_done=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Find Done Transition
        if: steps.status.outputs.already_done != 'true'
        id: transition
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_KEY: ${{ steps.extract.outputs.jira_key }}
        run: |
          set -euo pipefail

          BASE_URL="${JIRA_BASE_URL%/}"

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --output jira-transitions.json \
            --write-out "%{http_code}" \
            --request GET \
            --url "${BASE_URL}/rest/api/3/issue/${JIRA_KEY}/transitions" \
            --user "${JIRA_USER_EMAIL}:${JIRA_API_TOKEN}" \
            --header "Accept: application/json")

          echo "Jira 전환 목록 조회 응답: ${HTTP_STATUS}"
          cat jira-transitions.json
          echo

          if [[ "${HTTP_STATUS}" -lt 200 || "${HTTP_STATUS}" -ge 300 ]]; then
            echo "Jira 상태 전환 목록을 조회하지 못했습니다."
            exit 1
          fi

          TRANSITION_ID=$(jq -r '
            [
              .transitions[]
              | select(
                  .to.name == "완료"
                  or .to.name == "Done"
                  or .to.statusCategory.key == "done"
                )
            ][0].id // empty
          ' jira-transitions.json)

          if [[ -z "${TRANSITION_ID}" ]]; then
            echo "현재 상태에서 완료로 이동하는 전환을 찾지 못했습니다."
            echo
            echo "현재 사용할 수 있는 전환:"

            jq -r '
              .transitions[]
              | "- \(.name) → \(.to.name) (ID: \(.id))"
            ' jira-transitions.json

            exit 1
          fi

          echo "transition_id=${TRANSITION_ID}" >> "${GITHUB_OUTPUT}"
          echo "완료 전환 ID: ${TRANSITION_ID}"

      - name: Transition Jira Issue to Done
        if: steps.status.outputs.already_done != 'true'
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_KEY: ${{ steps.extract.outputs.jira_key }}
          TRANSITION_ID: ${{ steps.transition.outputs.transition_id }}
        run: |
          set -euo pipefail

          BASE_URL="${JIRA_BASE_URL%/}"

          jq -n \
            --arg transitionId "${TRANSITION_ID}" \
            '{
              transition: {
                id: $transitionId
              }
            }' > jira-transition-payload.json

          echo "Jira 상태 전환 요청:"
          cat jira-transition-payload.json
          echo

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --output jira-transition-response.txt \
            --write-out "%{http_code}" \
            --request POST \
            --url "${BASE_URL}/rest/api/3/issue/${JIRA_KEY}/transitions" \
            --user "${JIRA_USER_EMAIL}:${JIRA_API_TOKEN}" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --data @jira-transition-payload.json)

          echo "Jira 상태 전환 응답: ${HTTP_STATUS}"
          cat jira-transition-response.txt
          echo

          if [[ "${HTTP_STATUS}" -lt 200 || "${HTTP_STATUS}" -ge 300 ]]; then
            echo "Jira 티켓을 완료 상태로 변경하지 못했습니다."
            exit 1
          fi

          echo "${JIRA_KEY} 티켓을 완료 상태로 변경했습니다."

      - name: Leave Completion Comment
        uses: actions/github-script@v8
        env:
          JIRA_KEY: ${{ steps.extract.outputs.jira_key }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          ALREADY_DONE: ${{ steps.status.outputs.already_done }}
        with:
          script: |
            const jiraKey =
              process.env.JIRA_KEY;

            const baseUrl =
              process.env.JIRA_BASE_URL.replace(
                /\/$/,
                ""
              );

            const jiraUrl =
              `${baseUrl}/browse/${jiraKey}`;

            const message =
              process.env.ALREADY_DONE === "true"
                ? "Jira 티켓이 이미 완료 상태입니다."
                : "Jira 티켓을 완료 상태로 변경했습니다.";

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                "✅ **GitHub Issue 종료가 Jira에 반영되었습니다.**",
                "",
                `- Jira 티켓: [${jiraKey}](${jiraUrl})`,
                `- 처리 결과: ${message}`
              ].join("\n")
            });
