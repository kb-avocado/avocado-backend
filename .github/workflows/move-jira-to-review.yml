name: Move Jira Issue to Review

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
    branches:
      - develop

jobs:
  move-jira-to-review:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Extract Jira Key
        id: extract
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          echo "PR 브랜치: ${BRANCH_NAME}"
          echo "PR 제목: ${PR_TITLE}"

          JIRA_KEY=$(printf '%s' "${BRANCH_NAME}" \
            | grep -oE 'AVCD-[0-9]+' \
            | head -n 1 || true)

          if [[ -z "${JIRA_KEY}" ]]; then
            JIRA_KEY=$(printf '%s' "${PR_TITLE}" \
              | grep -oE 'AVCD-[0-9]+' \
              | head -n 1 || true)
          fi

          if [[ -z "${JIRA_KEY}" ]]; then
            echo "브랜치명 또는 PR 제목에서 Jira 키를 찾지 못했습니다."
            echo "브랜치명: ${BRANCH_NAME}"
            echo "PR 제목: ${PR_TITLE}"
            exit 1
          fi

          if [[ ! "${JIRA_KEY}" =~ ^AVCD-[0-9]+$ ]]; then
            echo "잘못된 Jira 키입니다: ${JIRA_KEY}"
            exit 1
          fi

          echo "jira_key=${JIRA_KEY}" >> "${GITHUB_OUTPUT}"
          echo "추출된 Jira 키: ${JIRA_KEY}"

      - name: Check Current Jira Status
        id: status
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_KEY: ${{ steps.extract.outputs.jira_key }}
        run: |
          set -euo pipefail

          BASE_URL="${JIRA_BASE_URL%/}"

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --output jira-issue.json \
            --write-out "%{http_code}" \
            --request GET \
            --url "${BASE_URL}/rest/api/3/issue/${JIRA_KEY}?fields=status" \
            --user "${JIRA_USER_EMAIL}:${JIRA_API_TOKEN}" \
            --header "Accept: application/json")

          echo "Jira 티켓 조회 응답: ${HTTP_STATUS}"
          cat jira-issue.json
          echo

          if [[ "${HTTP_STATUS}" -lt 200 || "${HTTP_STATUS}" -ge 300 ]]; then
            echo "Jira 티켓을 조회하지 못했습니다: ${JIRA_KEY}"
            exit 1
          fi

          CURRENT_STATUS=$(jq -r '.fields.status.name' jira-issue.json)

          echo "현재 Jira 상태: ${CURRENT_STATUS}"

          if [[ "${CURRENT_STATUS}" == "검토 중" || "${CURRENT_STATUS}" == "In Review" ]]; then
            echo "already_in_review=true" >> "${GITHUB_OUTPUT}"
            echo "이미 검토 중 상태입니다."
          else
            echo "already_in_review=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Find Review Transition
        if: steps.status.outputs.already_in_review != 'true'
        id: transition
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_KEY: ${{ steps.extract.outputs.jira_key }}
        run: |
          set -euo pipefail

          BASE_URL="${JIRA_BASE_URL%/}"

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --output jira-transitions.json \
            --write-out "%{http_code}" \
            --request GET \
            --url "${BASE_URL}/rest/api/3/issue/${JIRA_KEY}/transitions" \
            --user "${JIRA_USER_EMAIL}:${JIRA_API_TOKEN}" \
            --header "Accept: application/json")

          echo "Jira 전환 목록 조회 응답: ${HTTP_STATUS}"
          cat jira-transitions.json
          echo

          if [[ "${HTTP_STATUS}" -lt 200 || "${HTTP_STATUS}" -ge 300 ]]; then
            echo "Jira 상태 전환 목록을 조회하지 못했습니다."
            exit 1
          fi

          TRANSITION_ID=$(jq -r '
            [
              .transitions[]
              | select(
                  .to.name == "검토 중"
                  or .to.name == "In Review"
                )
            ][0].id // empty
          ' jira-transitions.json)

          if [[ -z "${TRANSITION_ID}" ]]; then
            echo "현재 상태에서 검토 중으로 이동할 수 없습니다."
            echo
            echo "현재 사용할 수 있는 전환:"

            jq -r '
              .transitions[]
              | "- \(.name) → \(.to.name) (ID: \(.id))"
            ' jira-transitions.json

            exit 1
          fi

          echo "transition_id=${TRANSITION_ID}" >> "${GITHUB_OUTPUT}"
          echo "검토 중 전환 ID: ${TRANSITION_ID}"

      - name: Transition Jira Issue to Review
        if: steps.status.outputs.already_in_review != 'true'
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_KEY: ${{ steps.extract.outputs.jira_key }}
          TRANSITION_ID: ${{ steps.transition.outputs.transition_id }}
        run: |
          set -euo pipefail

          BASE_URL="${JIRA_BASE_URL%/}"

          jq -n \
            --arg transitionId "${TRANSITION_ID}" \
            '{
              transition: {
                id: $transitionId
              }
            }' > jira-transition-payload.json

          echo "Jira 상태 전환 요청:"
          cat jira-transition-payload.json
          echo

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --output jira-transition-response.txt \
            --write-out "%{http_code}" \
            --request POST \
            --url "${BASE_URL}/rest/api/3/issue/${JIRA_KEY}/transitions" \
            --user "${JIRA_USER_EMAIL}:${JIRA_API_TOKEN}" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --data @jira-transition-payload.json)

          echo "Jira 상태 전환 응답: ${HTTP_STATUS}"
          cat jira-transition-response.txt
          echo

          if [[ "${HTTP_STATUS}" -lt 200 || "${HTTP_STATUS}" -ge 300 ]]; then
            echo "Jira 티켓을 검토 중 상태로 변경하지 못했습니다."
            exit 1
          fi

          echo "${JIRA_KEY} 티켓을 검토 중 상태로 변경했습니다."
