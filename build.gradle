plugins {
    id 'java'
    id 'war'
}

group = 'org.scoula'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

ext {
    // Spring
    springVersion = '5.3.39'
    springSecurityVersion = '5.8.14'

    // Database
    mybatisVersion = '3.5.16'
    mybatisSpringVersion = '2.1.2'
    mysqlVersion = '8.1.0'
    hikariVersion = '5.1.0'

    // JSON
    jacksonVersion = '2.17.2'

    // Logging
    slf4jVersion = '2.0.13'
    log4jVersion = '2.23.1'

    // AOP
    aspectjVersion = '1.9.22.1'

    // Utility
    lombokVersion = '1.18.34'

    // Swagger
    springdocVersion = '1.8.0'
    springBootVersion = '2.7.18'

    // Test
    junitVersion = '5.10.3'
    assertjVersion = '3.26.3'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    /*
     * Spring Framework
     */
    implementation(
            "org.springframework:spring-context:${springVersion}"
    ) {
        exclude group: 'commons-logging',
                module: 'commons-logging'
    }

    implementation "org.springframework:spring-webmvc:${springVersion}"
    implementation "org.springframework:spring-jdbc:${springVersion}"
    implementation "org.springframework:spring-tx:${springVersion}"

    /*
     * Spring Security
     */
    implementation(
            "org.springframework.security:spring-security-web:${springSecurityVersion}"
    )

    implementation(
            "org.springframework.security:spring-security-config:${springSecurityVersion}"
    )

    /*
     * Servlet API
     */
    compileOnly 'javax.servlet:javax.servlet-api:4.0.1'

    /*
     * Java 표준 애너테이션
     */
    implementation 'javax.inject:javax.inject:1'
    implementation 'javax.annotation:javax.annotation-api:1.3.2'

    /*
     * AOP
     */
    implementation "org.aspectj:aspectjrt:${aspectjVersion}"
    implementation "org.aspectj:aspectjweaver:${aspectjVersion}"

    /*
     * MyBatis
     */
    implementation "org.mybatis:mybatis:${mybatisVersion}"
    implementation "org.mybatis:mybatis-spring:${mybatisSpringVersion}"

    /*
     * Database
     */
    implementation "com.mysql:mysql-connector-j:${mysqlVersion}"
    implementation "com.zaxxer:HikariCP:${hikariVersion}"

    /*
     * JSON
     */
    implementation(
            "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
    )

    implementation(
            "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:${jacksonVersion}"
    )

    /*
     * Logging
     */
    implementation "org.slf4j:slf4j-api:${slf4jVersion}"

    implementation "org.apache.logging.log4j:log4j-api:${log4jVersion}"
    implementation "org.apache.logging.log4j:log4j-core:${log4jVersion}"

    // SLF4J 2.x 로그를 Log4j2로 전달
    implementation(
            "org.apache.logging.log4j:log4j-slf4j2-impl:${log4jVersion}"
    )

    // Spring의 Commons Logging 호출을 Log4j2로 전달
    implementation(
            "org.apache.logging.log4j:log4j-jcl:${log4jVersion}"
    )

    /*
     * Lombok
     */
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    /*
     * OpenAPI 3 / Swagger UI
     */
    implementation(
            "org.springdoc:springdoc-openapi-ui:${springdocVersion}"
    )

    implementation(
            "org.springframework.boot:spring-boot:${springBootVersion}"
    )

    implementation(
            "org.springframework.boot:spring-boot-autoconfigure:${springBootVersion}"
    )

    /*
     * Test
     */
    testImplementation(
            "org.springframework:spring-test:${springVersion}"
    )

    testImplementation(
            "org.springframework.security:spring-security-test:${springSecurityVersion}"
    )

    testImplementation(
            "org.junit.jupiter:junit-jupiter:${junitVersion}"
    )

    testImplementation(
            "org.assertj:assertj-core:${assertjVersion}"
    )
}

tasks.named('test') {
    useJUnitPlatform()
}